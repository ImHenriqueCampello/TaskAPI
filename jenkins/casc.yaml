jenkins:
  systemMessage: "Jenkins do TaskAPI - configurado como código (JCasC)"
  numExecutors: 1
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "dockerhub-credentials"
              username: "${DOCKERHUB_USERNAME}"
              password: "${DOCKERHUB_TOKEN}"
              description: "Credencial do Docker Hub (vem do .env)"

# Único "checkout" configurado: o job só aponta para o repositório e o Jenkinsfile.
# Todas as etapas do pipeline ficam no Jenkinsfile.
jobs:
  - script: >
      pipelineJob('taskapi') {
        definition {
          cpsScm {
            scm {
              git {
                remote { url(System.getenv('GIT_REPO_URL')) }
                branches('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }

unclassified:
  location:
    url: "${JENKINS_PUBLIC_URL}"
