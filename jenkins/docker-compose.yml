services:
  jenkins:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true -Djenkins.model.Jenkins.numExecutors=1"

volumes:
  jenkins_home:
